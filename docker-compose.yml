version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:fX1c6IUH0fOM/6kat+nJP2ePlBZM+TocCNv4e+dJJRo=
      - APP_URL=https://leadfinderpro.creativecoding.cloud
      - TRUSTED_PROXIES=*
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.leadfinderpro.rule=Host(`leadfinderpro.creativecoding.cloud`)"
      - "traefik.http.routers.leadfinderpro.entrypoints=websecure"
      - "traefik.http.routers.leadfinderpro.tls.certresolver=letsencrypt"
      - "traefik.http.services.leadfinderpro.loadbalancer.server.port=10000"
      # HTTP → HTTPS Redirect (catch-all router on web entrypoint)
      - "traefik.http.routers.leadfinderpro-http.rule=Host(`leadfinderpro.creativecoding.cloud`)"
      - "traefik.http.routers.leadfinderpro-http.entrypoints=web"
      - "traefik.http.routers.leadfinderpro-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    volumes:
      - lfp-storage:/var/www/storage
      - lfp-database:/var/www/database
    working_dir: /var/www
    healthcheck:
      test: ["CMD", "php", "artisan", "route:list"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  lfp-storage:
  lfp-database:

networks:
  default:
    name: traefik
    external: true
