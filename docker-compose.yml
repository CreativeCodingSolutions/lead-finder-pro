version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "10002:10000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://leadfinderpro.creativecoding.cloud
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    volumes:
      - lfp-storage:/var/www/storage
      - lfp-database:/var/www/database
    working_dir: /var/www

volumes:
  lfp-storage:
  lfp-database:
